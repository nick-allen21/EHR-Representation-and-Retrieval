<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS229 Final Poster</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .fallback {
      padding: 0.75rem 1rem;
      text-align: center;
      font-size: 0.95rem;
      background: #1b1b1b;
      border-bottom: 1px solid #2b2b2b;
    }

    .fallback a {
      color: #9ecbff;
    }

    .poster {
      width: 100%;
      height: calc(100vh - 52px);
      border: 0;
      display: block;
      background: #111;
    }
  </style>
</head>
<body>
  <div class="fallback">
    If the poster does not load, <a href="poster.pdf">open the PDF directly</a>.
  </div>
  <embed class="poster" src="poster.pdf" type="application/pdf">
</body>
</html>
